name: C++ tests

on:
  push:
    branches: [main, develop, lyrical]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/coe-marble/rpp-test-container:lyrical-ubuntu26.04-capnp1.1.0-v1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.RPP_CI_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      ROS_DISTRO: lyrical
      PYTHONPATH: ${{ github.workspace }}/rpp_dev/src/rpp_testing
    steps:
      - name: Check out repository under test
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Check out RPP integration dependencies
        uses: actions/checkout@v4
        with:
          repository: coe-marble/rpp_dev
          # rpp_cpp's ROS Lyrical branch is integrated against rpp_dev/main;
          # the integration repository does not have a matching lyrical ref.
          ref: ${{ github.event.pull_request.base.ref || (github.ref_name == 'lyrical' && 'main') || github.ref_name }}
          path: rpp_dev
          submodules: recursive
          token: ${{ secrets.RPP_CI_TOKEN || github.token }}
      - name: Overlay the repository under test
        run: rsync -a --delete --exclude=.git candidate/ rpp_dev/src/rpp_cpp/
      - name: Install local RPP packages
        run: |
          for package in rpp_dev/src/rpp_common rpp_dev/src/rpp_plugin_registrator rpp_dev/src/rpp_orchestrator rpp_dev/src/rpp_py rpp_dev/src/rpp_cli rpp_dev/src/rpp_testing; do
            python -m pip install --no-deps -e "$package"
          done
          python -m pip install -e "rpp_dev/src/rpp_cli[test]"
          python -m pip install -e "rpp_dev/src/rpp_testing[test]"
      - name: Build and test
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --base-paths rpp_dev/src/rpp_cpp --symlink-install --cmake-args -DBUILD_TESTING=ON -DPython3_EXECUTABLE=/opt/rpp-test-venv/bin/python
          rpp init-home
          colcon test --packages-select rpp_cpp --event-handlers console_direct+
          colcon test-result --verbose
